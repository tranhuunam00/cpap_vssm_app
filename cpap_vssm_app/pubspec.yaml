name: cpap_vssm_app
description: CPAP BLE monitoring application for VSSM devices.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # =========================
  # UI
  # =========================
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.0

  # =========================
  # BLE
  # =========================
  flutter_blue_plus: ^1.35.12
  permission_handler: ^11.3.1

  # =========================
  # STATE MANAGEMENT
  # =========================
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # =========================
  # DEPENDENCY INJECTION
  # =========================
  get_it: ^8.0.2

  # =========================
  # ROUTING
  # =========================
  go_router: ^14.6.1

  # =========================
  # LOCAL STORAGE
  # =========================
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # =========================
  # CHARTS
  # =========================
  syncfusion_flutter_charts: ^27.1.48

  # =========================
  # LOGGING
  # =========================
  logger: ^2.4.0

  # =========================
  # MODEL / SERIALIZATION
  # =========================
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # =========================
  # UTILITIES
  # =========================
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # =========================
  # CODE GENERATION
  # =========================
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # =========================
  # CUSTOM FONTS (OPTIONAL)
  # =========================
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/mainIcon.png"

  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/icons/mainIcon.png"

  min_sdk_android: 21
